<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"> <!-- Bootstrap's dark mode: one attribute re-colours everything -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Muzik</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <!-- Bootstrap CSS from a CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="min-vh-100"> <!-- min-vh-100 = at least 100% of the screen height, so the dark background fills it -->

    <main class="container py-4"> <!-- container = centred, responsive width. py-4 = padding top and bottom -->

        <header class="text-center mb-4"> <!-- text-center = centred text. mb-4 = space below -->
            <h1>Muzik</h1>
            <p class="lead">Discover your favorite tunes</p> <!-- lead = slightly larger intro text -->
        </header>

        <form action="/search" method="GET" class="d-flex gap-2 mb-5"> <!-- d-flex = flexbox row. gap-2 = space between items -->
            <input type="search" id="site-search" name="q" class="form-control" placeholder="Search..." required>
            <button type="submit" class="btn btn-primary">Search</button> <!-- btn btn-primary = styled blue button -->
        </form>

        <section class="mb-5">
            <h2>Recently Searched</h2>
            <p>Paradise - Bazzi</p>
            <p>Back to Friends - Evanescence</p>
            <p>Make You Mine - Public</p>
        </section>

        <!-- Ethan's Section -->
        <section>
            <h2>Trending/New Releases</h2>
            <p>Here are some of our most popular songs!</p>
        </section>

    </main> <!-- this closing tag was missing in your original -->

</body>
</html>
